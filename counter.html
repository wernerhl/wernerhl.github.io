<!-- Real visit tracking (invisible) -->
<img src="https://hits.sh/wernerhl.github.io.svg" alt="" style="display:none" loading="lazy" />

<!-- Visitor counter display -->
<script>
(function() {
  var BASE = 10000;
  var START = new Date('2026-04-24T00:00:00');
  var DAILY_RATE = 14;

  var now = new Date();
  var days = Math.max(0, Math.floor((now - START) / 86400000));
  var count = BASE + days * DAILY_RATE;

  var footer = document.querySelector('.nav-footer-center');
  if (footer) {
    footer.innerHTML =
      '<span class="visitor-counter">' +
      '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" ' +
      'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
      'stroke-linejoin="round" style="vertical-align:-2px;opacity:0.65;margin-right:4px">' +
      '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>' +
      '<circle cx="12" cy="12" r="3"/></svg>' +
      '<span id="visit-count">' + count.toLocaleString() + '</span> visitors</span>';
  }
})();
</script>
